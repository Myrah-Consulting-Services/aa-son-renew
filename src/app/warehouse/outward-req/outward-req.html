<div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-box-arrow-right me-2"></i>
          Outward Request
        </h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="outwardForm" class="p-0">
          <!-- Section: Basic Info -->
          <div class="mb-3 border-bottom pb-2">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-bold small">Doc Date</label>
                <input type="date" class="form-control form-control-sm" formControlName="date">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">Reference No</label>
                <input type="text" class="form-control form-control-sm" formControlName="reference_no">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">Doc No</label>
                <div class="input-group input-group-sm">
                  <input type="text" class="form-control" formControlName="invoiceNo">
                  <button class="btn btn-outline-secondary" type="button" (click)="generateInvoiceNo()">
                    <i class="bi bi-arrow-clockwise"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Section: Dispatch & Delivery -->
          <div class="mb-3 border-bottom pb-2">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small fw-bold">Loading Bay Area *</label>
                <select class="form-select form-select-sm" formControlName="loadingBayArea">
                  <option value="">Select Loading Bay Area</option>
                  <option [value]="s.id" *ngFor="let s of loadingbayAreas">{{s.name}}</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">Delivery From</label>
                <input type="text" class="form-control form-control-sm" formControlName="warehouseIdName">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">Delivery To</label>
                <input type="text" class="form-control form-control-sm" formControlName="to_warehouseName">
              </div>
            </div>
            <div class="row g-3 mt-2">
              <div class="col-md-4">
                <label class="form-label fw-bold small">Vehicle No</label>
                <input type="text" class="form-control form-control-sm" formControlName="vehicleNo">
              </div>
            </div>
          </div>

          <!-- Section: Items -->
          <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="fw-bold">Items</span>
              <button *ngIf="!editOutwardId" type="button" class="btn btn-sm btn-success" (click)="addItem()">
                <i class="bi bi-plus"></i> Add Item
              </button>
            </div>
            <div class="card-body p-0">
              <table class="table table-sm mb-0">
                <thead>
                  <tr>
                    <th>Item Name</th>
                    <th>Item Code</th>
                    <th>Barcode</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody formArrayName="items">
                  <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <td>
                      <input type="text" class="form-control form-control-sm" formControlName="itemName" placeholder="Item Name">
                    </td>
                    <td>
                      <input type="text" class="form-control form-control-sm" formControlName="item_code" placeholder="Item Code">
                    </td>
                    <td>
                      <input type="text" class="form-control form-control-sm" formControlName="barcode" placeholder="Barcode">
                    </td>
                    <td>
                      <input type="number" class="form-control form-control-sm" formControlName="quantity" min="1">
                    </td>
                    <td>
                      <select type="text" class="form-control form-control-sm" formControlName="unit" placeholder="Unit">
                        <option *ngFor="let unit of itemUnits[i] || units" [value]="unit.id">{{ unit.name }}</option>
                      </select>
                    </td>
                    <td>
                      <button type="button" class="btn btn-sm btn-danger" (click)="removeItem(i)">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Section: Remarks -->
          <div class="mb-2">
            <label class="form-label fw-bold small">Remarks</label>
            <textarea class="form-control form-control-sm" formControlName="remarks" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <div class="d-flex justify-content-end w-100" *ngIf="hide==6">
          <button type="button" class="btn btn-secondary btn-sm me-2" (click)="closeModal()">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button>
          <button type="submit" class="btn btn-primary btn-sm" (click)="submit()">
            <i class="bi bi-check-circle me-1"></i> Dispatch
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
