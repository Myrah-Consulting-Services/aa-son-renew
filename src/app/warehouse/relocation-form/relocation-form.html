<div class="modal-header bg-light border-bottom-0">
  <h4 class="modal-title fw-bold text-primary">{{ isEditMode ? 'Edit Item Relocation' : 'New Item Relocation' }}</h4>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
</div>
<div class="modal-body">
  <form [formGroup]="form">
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-6">
        <label for="date" class="form-label">Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control form-control-sm" formControlName="date">
      </div>
    </div>

    <hr class="my-2">

    <!-- Items Section -->
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2" >
        <h6 class="mb-0 fw-semibold">Items to Relocate</h6>
        <button *ngIf="!isEditMode" type="button" class="btn btn-sm btn-outline-primary" (click)="addItem()">
          <i class="bi bi-plus"></i> Add Item
        </button>
      </div>
      <div formArrayName="items" class="bg-light rounded shadow-sm p-2">
        <table class="table table-sm table-bordered mb-0">
          <thead class="table-light small">
            <tr>
              <th style="width: 40px;">#</th>
              <th>Item</th>
              <th style="width: 120px;">From Location</th>
              <th style="width: 120px;">To Location</th>
              <th style="width: 100px;">Quantity</th>
              <th style="width: 50px;">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of itemsArray.controls; let i=index" [formGroupName]="i">
              <td class="text-center">{{ i + 1 }}</td>
              <td>
                <ng-container *ngIf="isEditMode; else createMode">
                  <select class="form-select form-select-sm" formControlName="itemId">
                    <option value="">Select item...</option>
                    <option *ngFor="let itm of items" [value]="itm.id">{{ itm.name }}</option>
                  </select>
                </ng-container>
                <ng-template #createMode>
                  <div class="position-relative">
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      formControlName="itemId"
                      (focus)="onItemFocus(i)"
                      (input)="onItemInput(i, $event)"
                      (blur)="onItemBlur(i)"
                      placeholder="Search item..."
                      autocomplete="off"
                    />
                    <div class="dropdown-menu show position-absolute w-100"
                         *ngIf="showItemDropdown[i] && (filteredItems[i]?.length || 0) > 0"
                         style="top: 100%; z-index: 1050; max-height: 150px; overflow-y: auto;">
                      <div class="dropdown-item py-1"
                           *ngFor="let itm of (filteredItems[i] || [])"
                           (mousedown)="selectItem(i, itm)"
                           style="cursor: pointer;">
                        <div class="small fw-bold">{{ itm.name }}</div>
                        <small class="text-muted">{{ itm.item_code }}</small>
                      </div>
                    </div>
                  </div>
                </ng-template>
              </td>
              <td>
                <select class="form-select form-select-sm" formControlName="fromLocationId">
                  <option value="">From</option>
                  <option *ngFor="let l of itemLocations[i]" [value]="l.location_id">
                    {{ l.location_name }} ({{ l.qty }} in stock)
                  </option>
                </select>
              </td>
              <td>
                <select class="form-select form-select-sm" formControlName="toLocationId">
                  <option value="">To</option>
                  <option *ngFor="let l of locations" [value]="l.id">{{l.name}}</option>
                </select>
              </td>
              <td>
                <input type="number" class="form-control form-control-sm" formControlName="quantity" min="1">
                <div *ngIf="item.get('quantity')?.errors?.['custom'] && item.get('quantity')?.touched" class="text-danger small mt-1">
                  {{ item.get('quantity')?.errors?.['custom'] }}
                </div>
              </td>
              <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger"
                        (click)="removeItem(i)"
                        [disabled]="itemsArray.length === 1"
                        title="Remove Item">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mb-3">
      <label for="reason" class="form-label">Reason for Relocation</label>
      <textarea class="form-control form-control-sm" formControlName="reason" rows="2" placeholder="Optional"></textarea>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-primary btn-sm" (click)="save()" [disabled]="form.invalid">
    {{ isEditMode ? 'Update Relocation' : 'Relocate Items (' + itemsArray.length + ')' }}
  </button>
</div>
