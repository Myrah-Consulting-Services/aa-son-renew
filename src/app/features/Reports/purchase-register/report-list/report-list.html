<!-- Report List Page -->
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-md-3 col-lg-2 mb-4">
      <div class="bg-white rounded shadow-sm p-3 h-100">
        <input type="text" class="form-control mb-3" placeholder="Search Reports" [(ngModel)]="searchTerm" (input)="setSearchTerm(searchTerm)">
        <ul class="nav flex-column nav-pills">
          <li class="nav-item mb-1" *ngFor="let cat of categories">
            <a class="nav-link" href="#" [class.active]="activeCategory === cat" (click)="setCategory(cat); $event.preventDefault();">{{cat}}</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="col-md-9 col-lg-10">
      <h3 class="fw-bold mb-4">All Reports</h3>
      <div class="row g-4">
        <div class="col-md-4 col-12" *ngFor="let report of filteredReports">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title fw-bold">{{ report.name }}</h5>
              <p class="card-text text-muted">{{ report.description }}</p>
              <a [routerLink]="report.routerLink" [queryParams]="report.queryParams || null" class="btn btn-outline-primary">Go to {{ report.name }}</a>
            </div>
          </div>
        </div>
        <div class="col-12" *ngIf="filteredReports.length === 0">
          <div class="text-muted">No reports found.</div>
        </div>
      </div>
    </div>
  </div>
  
</div>
