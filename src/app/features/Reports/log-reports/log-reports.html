<div class="log-reports-container">
  <h2 class="log-title">Portal Login Activity Log</h2>
  <table class="log-table" *ngIf="logData.length > 0; else noData">
    <thead>
      <tr>
        <th>#</th>
        <th>Email</th>
        <th>Location</th>
        <th>IP Address</th>
        <th>Portal Type</th>
        <th>Date & Time</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logData; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ log.email }}</td>
        <td>
          <ng-container *ngIf="log.loc; else noLoc">
            <span class="loc-badge">{{ log.loc }}</span>
          </ng-container>
          <ng-template #noLoc>
            <span class="text-muted">-</span>
          </ng-template>
        </td>
        <td>
          <ng-container *ngIf="log.ip; else noIp">
            <span class="ip-badge">{{ log.ip }}</span>
          </ng-container>
          <ng-template #noIp>
            <span class="text-muted">-</span>
          </ng-template>
        </td>
        <td>
          <ng-container [ngSwitch]="log.portal_type_id">
            <span *ngSwitchCase="1" class="badge badge-primary">Admin</span>
            <span *ngSwitchCase="2" class="badge badge-success">User</span>
            <span *ngSwitchDefault class="badge badge-secondary">Unknown</span>
          </ng-container>
        </td>
        <td>{{ log.created_at | date:'dd/MM/yyyy, HH:mm:ss' }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noData>
    <div class="no-data-message">
      <i class="bi bi-emoji-frown text-muted" style="font-size: 2rem;"></i>
      <p class="text-muted mt-2">No log data available.</p>
    </div>
  </ng-template>
</div>
