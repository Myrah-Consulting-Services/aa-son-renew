<div class="container-fluid py-4">
  <div class="card shadow-sm border-0 p-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h3 class="fw-bold text-primary mb-0">
        <i class="bi bi-file-earmark-zip me-2"></i>VAT Audit File (FAF) Generator
      </h3>
    </div>

    <!-- Date Filter -->
    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-3">
        <label for="dateFrom" class="form-label fw-semibold small">From</label>
        <input type="date" class="form-control" id="dateFrom" [(ngModel)]="dateFrom">
      </div>
      <div class="col-md-3">
        <label for="dateTo" class="form-label fw-semibold small">To</label>
        <input type="date" class="form-control" id="dateTo" [(ngModel)]="dateTo">
      </div>
    </div>

    <!-- Description -->
    <p class="text-muted">
      This report generates a VAT Audit File (FAF) in a CSV format as required by the Federal Tax Authority (FTA) for audits. 
      Select a date range and click the button to download the file containing all relevant transactions for that period.
    </p>

    <!-- Generate Button -->
    <div class="mt-3">
      <button class="btn btn-primary btn-lg" (click)="generateFafFile()">
        <i class="bi bi-download me-2"></i>Generate and Download FAF
      </button>
    </div>
  </div>
</div>
