<form [formGroup]="partyForm" class="p-3" (ngSubmit)="onFormSubmit()">
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div [class.d-none]="isLoading" class="row g-3">
    <!-- Left Column -->
    <div class="col-md-6">
      <!-- Party Type & Basic Info -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <h6 class="card-title mb-0 me-3">Party Type</h6>
            <div class="ms-2" placement="right" ngbTooltip="Select whether this party is a customer or vendor">
              <i class="bi bi-info-circle text-muted"></i>
            </div>
            <div class="form-check form-check-inline ms-3">
              <input class="form-check-input" type="radio" formControlName="partyType" value="1" id="customerRadio">
              <label class="form-check-label" for="customerRadio">Customer</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="partyType" value="2" id="vendorRadio">
              <label class="form-check-label" for="vendorRadio">Vendor</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label d-flex align-items-center gap-2">
              Party Name <span class="text-danger">*</span>
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Enter the full name of the customer or vendor"></i>
            </label>
            <input type="text" class="form-control" formControlName="partyName" placeholder="Enter party name">
            <div *ngIf="partyForm.get('partyName')?.touched && partyForm.get('partyName')?.invalid" class="text-danger small mt-1">
              Party name is required
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label d-flex align-items-center gap-2">
                Contact <span class="text-danger">*</span>
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter the contact number with country code"></i>
              </label>
              <div class="input-group">
                <select class="form-select" style="max-width: 140px;" formControlName="contact_code">
                  <option *ngFor="let code of countryCodes" [value]="code.code">{{code.code}} {{code.name}}</option>
                </select>
                <input type="text" class="form-control" formControlName="contact" placeholder="Phone number">
              </div>
              <div *ngIf="partyForm.get('contact')?.touched && partyForm.get('contact')?.invalid" class="text-danger small mt-1">
                Phone number must be 7-12 digits
              </div>
            </div>
            <div class="col-md-12">
              <label class="form-label d-flex align-items-center gap-2">
                Email
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter a valid email address for communications"></i>
              </label>
              <input type="email" class="form-control" formControlName="email" placeholder="Email address">
              <div *ngIf="partyForm.get('email')?.touched && partyForm.get('email')?.invalid" class="text-danger small mt-1">
                Invalid email
              </div>
            </div>
          </div>

          <div class="row g-3 mt-2">
            <div class="col-md-12">
              <label class="form-label d-flex align-items-center gap-2">
                TRN 
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter the 15-digit Tax Registration Number"></i>
              </label>
              <input type="text" class="form-control" formControlName="trn" placeholder="15-digit TRN">
              <div *ngIf="partyForm.get('trn')?.touched && partyForm.get('trn')?.invalid" class="text-danger small mt-1">
                Must be 15 digits
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Financial Info -->
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <h6 class="card-title mb-0">Financial Details</h6>
            <div class="ms-2" placement="right" ngbTooltip="Manage financial settings for this party">
              <i class="bi bi-info-circle text-muted"></i>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label d-flex align-items-center gap-2">
                Opening Balance
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter the initial balance for this party"></i>
              </label>
              <div class="input-group">
                <input type="number" class="form-control" formControlName="openingBalance" placeholder="0.00">
                <select class="form-select" formControlName="openingBalanceType">
                  <option *ngFor="let type of openingBalanceTypes" [value]="type.id">{{type.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label d-flex align-items-center gap-2">
                Credit Period
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Specify the credit period in days"></i>
              </label>
              <input type="number" class="form-control" formControlName="creditPeriod" placeholder="Enter days">
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label d-flex align-items-center gap-2">
              Credit Limit
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Set the maximum credit limit for this party"></i>
            </label>
            <input type="number" class="form-control" formControlName="creditLimit" placeholder="Enter limit">
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-md-6">
      <!-- Address Info -->
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <h6 class="card-title mb-0">Address Details</h6>
            <div class="ms-2" placement="right" ngbTooltip="Manage billing and shipping addresses">
              <i class="bi bi-info-circle text-muted"></i>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label d-flex align-items-center gap-2">
              Billing Address
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Enter the address for billing purposes"></i>
            </label>
            <textarea class="form-control" formControlName="billingAddress" rows="2" maxlength="100" 
                      placeholder="Enter billing address"></textarea>
            <div class="small text-muted text-end">{{partyForm.get('billingAddress')?.value?.length || 0}} / 100</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label d-flex align-items-center gap-2 mb-0">
              Shipping Address
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Enter the delivery address"></i>
            </label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="sameAsBilling" 
                     (change)="onSameAsBillingChange()" id="sameAsBilling">
              <label class="form-check-label" for="sameAsBilling">Same as Billing</label>
            </div>
          </div>
          <textarea class="form-control" formControlName="shippingAddress" rows="2" maxlength="150" 
                    placeholder="Enter shipping address"></textarea>
          <div class="small text-muted text-end">{{partyForm.get('shippingAddress')?.value?.length || 0}} / 150</div>

          <div class="mt-3">
            <label class="form-label d-flex align-items-center gap-2">
              Country <span class="text-danger">*</span>
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Select the country of operation"></i>
            </label>
            <select class="form-select" formControlName="country">
              <option *ngFor="let c of countries" [value]="c.id">{{c.name}}</option>
            </select>
          </div>

          <div class="mt-3" *ngIf="partyForm.get('country')?.value == 1">
            <label class="form-label d-flex align-items-center gap-2">
              Emirate <span class="text-danger">*</span>
              <i class="bi bi-info-circle text-muted" placement="right" 
                 ngbTooltip="Select the Emirate"></i>
            </label>
            <select class="form-select" formControlName="emirates">
              <option *ngFor="let e of uaeEmirates" [value]="e.value">{{e.label}}</option>
            </select>
          </div>

          <div class="row g-3 mt-2">
            <div class="col-md-6">
              <label class="form-label d-flex align-items-center gap-2">
                City
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter the city name"></i>
              </label>
              <input type="text" class="form-control" formControlName="city" placeholder="City">
            </div>
            <div class="col-md-6">
              <label class="form-label d-flex align-items-center gap-2">
                Postal Code
                <i class="bi bi-info-circle text-muted" placement="right" 
                   ngbTooltip="Enter the postal/ZIP code"></i>
              </label>
              <input type="text" class="form-control" formControlName="postalCode" placeholder="Postal code">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Actions -->
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-secondary" (click)="modalService.dismissAll()">
      <i class="bi bi-x-lg me-1"></i>Cancel
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="partyForm.invalid">
      <i class="bi bi-check-lg me-1"></i>Save
    </button>
  </div>
</form>
