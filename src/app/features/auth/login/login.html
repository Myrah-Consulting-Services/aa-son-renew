<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card overflow-hidden">
        <!-- Header with purple background -->
        <div class="bg-soft bg-primary">
          <div class="row" style="background-color: #41299b;">
            <div class="col-6">
              <div class="text-primary p-4">
                <h5 class="text-white">Welcome Back!</h5>
                <!-- <p class="text-white">Sign in to continue to ESARWA.</p> -->
              </div>
            </div>
            <div class="col-6 d-flex align-items-center justify-content-center">
              <img src="assets/images/logo_dark.png" width="140px" alt="ESARWA Logo">
            </div>
          </div>
        </div>

        <!-- Login Form -->
        <div class="card-body pt-0">
          <div class="p-2">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
              <div class="form-group">
                <label for="email">Email or Mobile</label>
                <input 
                  type="text" 
                  id="email" 
                  formControlName="email"
                  [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
                  placeholder="Enter email or mobile number"
                >
                <div class="invalid-feedback" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                  <span *ngIf="loginForm.get('email')?.errors?.['required']">Email or mobile is required</span>
                  <span *ngIf="loginForm.get('email')?.errors?.['pattern']">Please enter a valid email or 10-digit mobile number</span>
                </div>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input">
                  <input 
                    [type]="showPassword ? 'text' : 'password'" 
                    id="password" 
                    formControlName="password"
                    [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
                    placeholder="Enter password"
                  >
                  <button type="button" class="toggle-password" (click)="togglePassword()">
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
                <div class="invalid-feedback" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
                  <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
                </div>
              </div>

              <!-- <div class="form-check">
                <div class="row">
                  <div class="text-end">
                    <a routerLink="/account/reset-password" class="text-muted">
                      <i class="bi bi-lock me-1"></i> Forgot your password?
                    </a>
                  </div>
                </div>
              </div> -->

              <div class="alert alert-danger" *ngIf="errorMessage">
                {{ errorMessage }}
              </div>

              <div class="mt-3 d-grid">
                <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  {{ isLoading ? 'Logging in...' : 'Login' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-5 text-center">
        <!-- <p>
          Don't have an account? 
          <a routerLink="/account/signup" class="fw-medium text-primary">Register now</a>
        </p>
        <div class="dropdown d-inline-block mb-3">
          <span class="active me-3">English</span>
          <span class="me-3">हिन्दी</span>
          <span class="me-3">ગુજરાતી</span>
          <span>मराठी</span>
        </div> -->
        <!-- <hr class="my-3" style="border-top: 1.5px solid #f6a019; width: 60px; margin: 1.5rem auto 0.5rem auto; opacity: 0.7;"> -->
        <p class="mb-0 small text-muted">
          &copy; 2025 <span class="fw-bold text-primary">Esarwa</span> &mdash; Developed by
          <i class="bi bi-lightning-charge-fill" style="color: #f6a019;"></i>
          <span class="fw-bold" style="color: #f6a019;">ESARWA</span>
        </p>
      </div>
    </div>
  </div>
</div>
