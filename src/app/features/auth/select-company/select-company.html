<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card overflow-hidden">
        <div class="bg-soft bg-primary">
          <div class="row" style="background-color: #41299b;">
            <div class="col-7">
              <div class="text-primary p-4">
                <h5 class="text-white mb-1">
                  {{ isSwitchMode ? 'Switch Company' : 'Select Company' }}
                </h5>
                <p class="text-white mb-0 small opacity-75">
                  {{ isSwitchMode ? 'Choose a different company to continue' : 'Choose a company to continue' }}
                </p>
              </div>
            </div>
            <div class="col-5 d-flex align-items-center justify-content-center">
              <img src="assets/images/logo_dark.png" width="120px" alt="ESARWA Logo">
            </div>
          </div>
        </div>

        <div class="card-body pt-0">
          <div class="p-2">
            <div *ngIf="isLoading" class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="text-muted mt-3 mb-0">Loading companies...</p>
            </div>

            <div *ngIf="!isLoading && errorMessage" class="alert alert-danger mb-0">
              {{ errorMessage }}
              <div class="mt-3">
                <button type="button" class="btn btn-outline-primary btn-sm" (click)="loadCompanies()">
                  Retry
                </button>
              </div>
            </div>

            <div *ngIf="!isLoading && !errorMessage && companies.length === 0" class="empty-state text-center py-4">
              <i class="bi bi-building fs-1 text-primary mb-3 d-block"></i>
              <h6 class="mb-2">No companies yet</h6>
              <p class="text-muted mb-0">Create your first company to continue.</p>
            </div>

            <div *ngIf="!isLoading && !errorMessage && companies.length > 0" class="company-list">
              <button
                type="button"
                class="company-item"
                *ngFor="let company of companies"
                [class.active]="isActiveCompany(company)"
                [disabled]="isSelecting"
                (click)="onSelectCompany(company)"
              >
                <div class="company-item-content">
                  <div class="company-icon">
                    <i class="bi bi-building"></i>
                  </div>
                  <div class="company-details">
                    <div class="company-name">{{ company.business_name }}</div>
                    <div class="company-meta">
                      <span class="badge text-bg-light text-capitalize">{{ company.role }}</span>
                      <span class="badge text-bg-warning" *ngIf="company.is_default">Default</span>
                      <span class="badge text-bg-success" *ngIf="isActiveCompany(company)">Current</span>
                    </div>
                  </div>
                  <div class="company-action">
                    <i class="bi bi-chevron-right"></i>
                  </div>
                </div>
              </button>
            </div>

            <div class="mt-3 d-grid" *ngIf="!isLoading">
              <a class="btn btn-primary" routerLink="/create-company" [queryParams]="{ from: 'select' }">
                <i class="bi bi-plus-circle me-2"></i>Create Company
              </a>
            </div>

            <div class="mt-3 d-grid" *ngIf="isSwitchMode && !isLoading">
              <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="isSelecting">
                Back to Dashboard
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4 text-center">
        <p class="mb-0 small text-muted">
          &copy; 2025 <span class="fw-bold text-primary">Esarwa</span>
        </p>
      </div>
    </div>
  </div>
</div>
