<div class="card p-3">
    <h5>{{ title }}</h5>
    <form (ngSubmit)="save()">
      <div class="row">
        <div class="col-md-6">
          <label>Employer's Contribution (%)</label>
          <input type="number" class="form-control" [(ngModel)]="benefit.employerContribution" name="employerContribution">
        </div>
        <div class="col-md-6">
          <label>Employees' Contribution (%)</label>
          <input type="number" class="form-control" [(ngModel)]="benefit.employeeContribution" name="employeeContribution">
        </div>
      </div>
  
      <div class="row mt-2">
        <div class="col-md-6">
          <label>Contributory Wage Max Limit</label>
          <input type="number" class="form-control" [(ngModel)]="benefit.contributoryWageMax" name="contributoryWageMax">
        </div>
        <div class="col-md-6">
          <label>Contributory Wage Min Limit</label>
          <input type="number" class="form-control" [(ngModel)]="benefit.contributoryWageMin" name="contributoryWageMin">
        </div>
      </div>
  
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" [(ngModel)]="benefit.proRata" name="proRata">
        <label class="form-check-label">Calculate on pro-rata basis</label>
      </div>
  
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" [(ngModel)]="benefit.renewal" name="renewal">
        <label class="form-check-label">Renewal at the start of the year</label>
      </div>
  
      <button class="btn btn-primary mt-3" type="submit">Save</button>
    </form>
  </div>
