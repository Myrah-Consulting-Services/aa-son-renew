<div class="branch-container">
  <div class="row">
    <!-- Add/Edit Branch Form -->
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">{{ isEditing ? 'Edit' : 'Add' }} Branch</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="branchForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Branch Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" formControlName="branchName" placeholder="Enter branch name">
                  <div *ngIf="branchForm.get('branchName')?.invalid && branchForm.get('branchName')?.touched" class="text-danger small mt-1">
                    <div *ngIf="branchForm.get('branchName')?.errors?.['required']">Branch name is required</div>
                  </div>
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Emirate</label>
                  <select class="form-select" formControlName="city">
                    <option value="">Select Emirate</option>
                    <option *ngFor="let emirate of uaeEmirates" [value]="emirate.value">{{ emirate.label }}</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Address</label>
                  <input type="text" class="form-control" formControlName="address" placeholder="Enter branch address">
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Postal Code</label>
                  <input type="text" class="form-control" formControlName="pincode" placeholder="Enter postal code">
                </div>
              </div>
            </div>

          

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="branchForm.invalid">
                {{ isEditing ? 'Update' : 'Add' }} Branch
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancelEdit()" *ngIf="isEditing">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
