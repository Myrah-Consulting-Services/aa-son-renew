<div class="department-container">
  <div class="row">
    <!-- Add/Edit Department Form -->
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">{{ isEditing ? 'Edit' : 'Add' }} Department</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Department Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" formControlName="department_name" placeholder="Enter department name">
                  <div *ngIf="departmentForm.get('department_name')?.invalid && departmentForm.get('department_name')?.touched" class="text-danger small mt-1">
                    <div *ngIf="departmentForm.get('department_name')?.errors?.['required']">Department name is required</div>
                  </div>
                </div>
              </div>
              
              <!-- <div class="col-md-6">
                <div class="mb-3">
                  <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" formControlName="active" id="activeCheck">
                    <label class="form-check-label" for="activeCheck">
                      Active
                    </label>
                  </div>
                </div>
              </div> -->
            </div>

            <!-- <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter department description"></textarea>
            </div> -->

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="departmentForm.invalid">
                {{ isEditing ? 'Update' : 'Add' }} Department
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancelEdit()" *ngIf="isEditing">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
