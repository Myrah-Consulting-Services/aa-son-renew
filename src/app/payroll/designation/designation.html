<div class="designation-container">
  <div class="row">
    <!-- Add/Edit Designation Form -->
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">{{ isEditing ? 'Edit' : 'Add' }} Designation</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="designationForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Designation Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" formControlName="designation_name" placeholder="Enter designation name">
                  <div *ngIf="designationForm.get('designation_name')?.invalid && designationForm.get('designation_name')?.touched" class="text-danger small mt-1">
                    <div *ngIf="designationForm.get('designation_name')?.errors?.['required']">Designation name is required</div>
                  </div>
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">Department <span class="text-danger">*</span></label>
                  <select class="form-select" formControlName="department">
                    <option value="">Select Department</option>
                    <option [value]="a.id" *ngFor="let a of departmentlist">{{a.department_name}}</option>
                    
                  </select>
                  <div *ngIf="designationForm.get('department')?.invalid && designationForm.get('department')?.touched" class="text-danger small mt-1">
                    <div *ngIf="designationForm.get('department')?.errors?.['required']">Department is required</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label">Description</label>
                  <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter designation description"></textarea>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="designationForm.invalid">
                {{ isEditing ? 'Update' : 'Add' }} Designation
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancelEdit()" *ngIf="isEditing">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
