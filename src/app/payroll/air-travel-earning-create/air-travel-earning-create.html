<form [formGroup]="airTravelForm" (ngSubmit)="saveAirTravel()">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Earning Name <span class="text-danger">*</span></label>
            <span *ngIf="!data">
            <select class="form-select" formControlName="earning_name">
              <option value="">Select...</option>
              <option *ngFor="let e of earningNames" [value]="e.id">{{e.payslip_name}}</option>
            </select>
            </span>
            <span *ngIf="data">
                {{data.head_name}}
            </span>
          </div>
          <div class="mb-3">
            <label class="form-label">Annual Amount <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text">AED</span>
              <input type="number" class="form-control" formControlName="annual_amount" min="0" step="0.01">
            </div>
            <div class="text-muted small mt-1">Max Limit : 100</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Payout Month <span class="text-danger">*</span></label>
            <input type="month" name="" id="" formControlName="payout_month" class="form-control" placeholder="M yyyy">
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <div>
            <button type="submit" class="btn btn-primary me-1">Save</button>
            <button type="button" class="btn btn-secondary" (click)="airTravelModalRef.close()">Cancel</button>
          </div>
          <div>
            <p class="text-end text-danger small">* indicates mandatory fields</p>
          </div>
        </div>
      </form>
