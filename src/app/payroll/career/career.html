<div class="career-container">
  <div class="page-header">
    <h1>Career Management</h1>
    <button class="btn-primary">Add Career Path</button>
  </div>

  <div class="career-content">
    <div class="career-stats">
      <div class="stat-card">
        <h3>Total Positions</h3>
        <div class="stat-number">24</div>
        <p>Available roles</p>
      </div>
      <div class="stat-card">
        <h3>Promotions</h3>
        <div class="stat-number">8</div>
        <p>This quarter</p>
      </div>
      <div class="stat-card">
        <h3>Career Plans</h3>
        <div class="stat-number">142</div>
        <p>Active plans</p>
      </div>
    </div>

    <div class="career-paths">
      <h2>Career Paths</h2>
      <div class="path-grid">
        <div class="path-card">
          <div class="path-header">
            <h3>Software Development</h3>
            <span class="level-count">5 Levels</span>
          </div>
          <div class="path-progress">
            <div class="progress-bar">
              <div class="progress-fill" style="width: 75%"></div>
            </div>
            <span class="progress-text">75% Complete</span>
          </div>
          <div class="path-actions">
            <button class="btn-secondary">View Details</button>
            <button class="btn-secondary">Edit Path</button>
          </div>
        </div>

        <div class="path-card">
          <div class="path-header">
            <h3>Human Resources</h3>
            <span class="level-count">4 Levels</span>
          </div>
          <div class="path-progress">
            <div class="progress-bar">
              <div class="progress-fill" style="width: 60%"></div>
            </div>
            <span class="progress-text">60% Complete</span>
          </div>
          <div class="path-actions">
            <button class="btn-secondary">View Details</button>
            <button class="btn-secondary">Edit Path</button>
          </div>
        </div>

        <div class="path-card">
          <div class="path-header">
            <h3>Finance & Accounting</h3>
            <span class="level-count">6 Levels</span>
          </div>
          <div class="path-progress">
            <div class="progress-bar">
              <div class="progress-fill" style="width: 45%"></div>
            </div>
            <span class="progress-text">45% Complete</span>
          </div>
          <div class="path-actions">
            <button class="btn-secondary">View Details</button>
            <button class="btn-secondary">Edit Path</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
