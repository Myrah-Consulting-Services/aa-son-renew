<!-- Main Content -->
<div class="container-fluid" [ngClass]="{'modal-mode': isModalMode}">
  <!-- Modal Header -->
  <div *ngIf="isModalMode" class="modal-header">
    <h4 class="modal-title">{{ isEditing ? 'Edit Deduction' : 'New Deduction' }}</h4>
    <button type="button" class="close-btn" (click)="closeModal()" aria-label="Close">
      <i class="bi bi-x"></i>
    </button>
  </div>
  
  <div class="row">
    <div class="col-12">
      

      <!-- Deduction Form -->
      <div class="card">
        <div class="card-body">
          <form [formGroup]="deductionForm" (ngSubmit)="onSubmit()">
            <!-- Name in Payslip -->
            <div class="mb-3">
              <label for="payslipName" class="form-label">Name in Payslip <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                id="payslipName" 
                formControlName="payslip_name"
                [class.is-invalid]="isFieldInvalid('payslip_name')"
                placeholder="Enter deduction name for payslip"
              >
              <div class="invalid-feedback" *ngIf="getErrorMessage('payslip_name')">
                {{ getErrorMessage('payslip_name') }}
              </div>
            </div>

            <!-- Deduction Frequency -->
            <div class="mb-3">
              <label class="form-label">Select the deduction frequency <span class="text-danger">*</span></label>
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="radio" 
                  id="oneTime" 
                  [value]="1" 
                  formControlName="deduction_frequency"
                >
                <label class="form-check-label" for="oneTime">
                  One-time deduction
                </label>
              </div>
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="radio" 
                  id="recurring" 
                  [value]="2" 
                  formControlName="deduction_frequency"
                >
                <label class="form-check-label" for="recurring">
                  Recurring deduction for subsequent Payrolls
                </label>
              </div>
            </div>

            <!-- Active Checkbox -->
            <div class="mb-4">
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="active" 
                  formControlName="active"
                >
                <label class="form-check-label" for="active">
                  Mark this as Active
                </label>
              </div>
            </div>

            <!-- Note Box -->
            <div class="alert alert-warning mb-4" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              <strong>Note:</strong> Once you associate this deduction with an employee, you will only be able to edit the Name in Payslip. The change will be reflected in both new and existing employees.
            </div>

            <!-- Hidden Head Type (required) -->
            <input type="hidden" formControlName="head_type" value="2">

            <!-- Form Actions -->
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <button 
                  type="submit" 
                  class="btn btn-primary me-2"
                  [disabled]="isLoading || deductionForm.invalid"
                >
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                  {{ isEditing ? 'Update' : 'Save' }}
                </button>
                <button type="button" class="btn btn-outline-secondary" (click)="isModalMode ? closeModal() : resetForm()">
                  {{ isModalMode ? 'Close' : 'Cancel' }}
                </button>
              </div>
              <small class="text-danger">* indicates mandatory fields</small>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
